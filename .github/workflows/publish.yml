# Publication is intentionally separate from PR CI.
# A merge to main publishes ONLY an unreleased version with finalized CHANGELOG.
# The exact pre-merge PR artifact is used (verified SHA/tree and 3 green OS jobs).
# No new build/tests/audits occur after merge. Registry OIDC environments:
# marketplace (Microsoft publisher trusted policy) and open-vsx (Open VSX trusted publisher).
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_VINCULIVO to authorize the current main version
        required: true
        type: string
      version:
        description: Must equal the exact version in package.json
        required: true
        type: string
      registries:
        description: Reconcile one registry or publish to both
        type: choice
        options: [both, marketplace, open-vsx]
        default: both
permissions: {}
concurrency:
  group: vinculivo-publish
  cancel-in-progress: false
jobs:
  authorize:
    name: Authorize exact pre-merge PR provenance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      publish: ${{ steps.provenance.outputs.publish }}
      version: ${{ steps.provenance.outputs.version }}
      run_id: ${{ steps.provenance.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned v7
        with:
          node-version: 22
      - name: Confirm changelog, tree identity, PR checks, VSIX artifact and version
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/release-plan.cjs >> "$GITHUB_OUTPUT"

  artifact:
    name: Reuse exact green PR VSIX (no rebuild)
    needs: authorize
    if: needs.authorize.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned v7
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # pinned v8
        with:
          name: vinculivo-private-vsix
          run-id: ${{ needs.authorize.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify immutable candidate without changing its bytes
        id: verify
        env:
          EXPECTED_VERSION: ${{ needs.authorize.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check vinculivo.vsix.sha256
          node scripts/smoke-vsix.cjs vinculivo.vsix
          sha256sum --check vinculivo.vsix.sha256
          node - <<'NODE'
          const {execFileSync}=require('node:child_process');
          const m=JSON.parse(execFileSync('unzip',['-p','vinculivo.vsix','extension/package.json'],{encoding:'utf8'}));
          if(m.name!=='vinculivo'||m.publisher!=='armotusitio'||m.version!==process.env.EXPECTED_VERSION||m.private===true||m.preview!==true){
            console.error('Packaged extension identity/version/preview differs from main');process.exit(1);
          }
          NODE
          echo "sha256=$(cut -d' ' -f1 vinculivo.vsix.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned v7
        with:
          name: vinculivo-release-vsix
          path: |
            vinculivo.vsix
            vinculivo.vsix.sha256
          if-no-files-found: error
          retention-days: 90

  marketplace:
    name: Publish Visual Studio Marketplace / OIDC
    needs: [authorize, artifact]
    if: needs.authorize.outputs.publish == 'true' && (github.event_name != 'workflow_dispatch' || inputs.registries == 'both' || inputs.registries == 'marketplace')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned v7
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # pinned v8
        with:
          name: vinculivo-release-vsix
      - name: Verify same VSIX from tested PR
        env:
          EXPECTED_SHA: ${{ needs.artifact.outputs.sha256 }}
        run: echo "$EXPECTED_SHA  vinculivo.vsix" | sha256sum --check -
      - name: Install pinned OIDC publisher
        run: npm install --global --ignore-scripts --no-audit --no-fund @vscode/vsce@4.1.0
      - name: Publish exact verified package (idempotent)
        shell: bash
        run: |
          unset VSCE_PAT AZURE_DEVOPS_EXT_PAT
          vsce publish --oidc --packagePath vinculivo.vsix --skip-duplicate

  open-vsx:
    name: Publish Open VSX / OIDC
    needs: [authorize, artifact]
    if: needs.authorize.outputs.publish == 'true' && (github.event_name != 'workflow_dispatch' || inputs.registries == 'both' || inputs.registries == 'open-vsx')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned v7
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # pinned v8
        with:
          name: vinculivo-release-vsix
      - name: Verify same VSIX from tested PR
        env:
          EXPECTED_SHA: ${{ needs.artifact.outputs.sha256 }}
        run: echo "$EXPECTED_SHA  vinculivo.vsix" | sha256sum --check -
      - name: Install pinned Open VSX publisher
        run: npm install --global --ignore-scripts --no-audit --no-fund ovsx@1.3.0
      - name: Publish identical package or skip existing version
        shell: bash
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          set -euo pipefail
          url="https://open-vsx.org/api/armotusitio/vinculivo/$VERSION"
          status=$(curl --retry 3 --retry-delay 2 -sS -o /dev/null -w '%{http_code}' "$url")
          if [ "$status" = 200 ]; then
            echo "Open VSX $VERSION already published; no mutation."
            exit 0
          fi
          if [ "$status" != 404 ]; then
            echo "::error::Cannot verify Open VSX version (HTTP $status)"
            exit 1
          fi
          unset OVSX_PAT
          ovsx publish vinculivo.vsix --trusted-publishing

  github-release:
    name: GitHub prerelease from verified VSIX
    needs: [authorize, artifact, marketplace]
    if: needs.artifact.result == 'success' && needs.marketplace.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # pinned v8
        with:
          name: vinculivo-release-vsix
      - name: Recheck checksum before immutable GitHub prerelease
        env:
          EXPECTED_SHA: ${{ needs.artifact.outputs.sha256 }}
        run: echo "$EXPECTED_SHA  vinculivo.vsix" | sha256sum --check -
      - name: Release exact package from validated merge SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.authorize.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub prerelease $tag already exists. No overwrite."
            exit 0
          fi
          gh release create "$tag" vinculivo.vsix vinculivo.vsix.sha256 \
            --title "Vinculivo $VERSION Preview" --prerelease \
            --notes "Vinculivo Preview $VERSION — verified PR artifact (same SHA-256 in both registries)." \
            --target "$GITHUB_SHA"
