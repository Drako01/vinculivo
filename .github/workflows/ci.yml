name: Private PR verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vinculivo-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck, build and unit tests
        run: npm run verify
      - name: Package private installation candidate
        if: runner.os == 'Linux'
        run: npm run package:vsix
      - name: Upload private VSIX for manual testing
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned
        with:
          name: vinculivo-private-vsix
          path: |
            vinculivo.vsix
            vinculivo.vsix.sha256
          if-no-files-found: error
# Intentionally no push-to-main, release, Marketplace or Open VSX publishing job.
